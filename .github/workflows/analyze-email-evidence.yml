name: Analyze uploaded email evidence

on:
  workflow_dispatch:
    inputs:
      evidence_id:
        description: SHA-256 evidence ID returned by the local ingest command
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: analyze-email-evidence-${{ inputs.evidence_id }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-workflow.txt
      - name: Install OCR engine
        run: sudo apt-get update && sudo apt-get install --yes tesseract-ocr
      - run: pip install -r requirements-workflow.txt
      - name: Compare evidence with official collection state
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          EVIDENCE_R2_ACCOUNT_ID: ${{ secrets.EVIDENCE_R2_ACCOUNT_ID }}
          EVIDENCE_R2_ACCESS_KEY_ID: ${{ secrets.EVIDENCE_R2_ACCESS_KEY_ID }}
          EVIDENCE_R2_SECRET_ACCESS_KEY: ${{ secrets.EVIDENCE_R2_SECRET_ACCESS_KEY }}
          EVIDENCE_R2_BUCKET_NAME: ${{ secrets.EVIDENCE_R2_BUCKET_NAME }}
        run: python scripts/data_v2/compare_email_evidence.py --evidence-id "${{ inputs.evidence_id }}" --refresh-ocr --output email-evidence-report.json
      - name: Upload review report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-evidence-review-${{ inputs.evidence_id }}-${{ github.run_id }}
          path: email-evidence-report.json
          if-no-files-found: warn
          retention-days: 30
