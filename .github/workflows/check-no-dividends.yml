name: Check No-Dividend Symbols

on:
    schedule:
        # 매주 토요일 오전 9시 (KST) = 매주 토요일 00:00 (UTC)
        - cron: '0 0 * * 6'
    workflow_dispatch: # 수동 실행 가능

permissions:
    contents: read
    issues: write

jobs:
    check-no-dividends:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'

            - name: Install dependencies
              run: |
                  pip install yfinance tqdm

            - name: Check no-dividend symbols
              id: check
              run: |
                  python scripts/data_pipeline/check_no_dividend_status.py > check_result.txt
                  cat check_result.txt
                  echo "result_file=check_result.txt" >> $GITHUB_OUTPUT

            - name: Create Issue if changes detected
              if: success()
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const result = fs.readFileSync('check_result.txt', 'utf8');

                      // 변경사항이 있는지 확인
                      const hasChanges = result.includes('🎉 Found') && !result.includes('🎉 Found 0');

                      if (hasChanges) {
                        // 이슈 생성
                        await github.rest.issues.create({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          title: '📊 No-Dividend Status Update Available',
                          body: `## 배당 상태 변경 감지\n\n주간 체크 결과 일부 종목의 배당 상태가 변경되었습니다.\n\n\`\`\`\n${result}\n\`\`\`\n\n### 다음 단계\n1. 변경사항을 검토하세요\n2. 필요시 \`mark_all_no_dividends.py\` 스크립트를 실행하여 업데이트하세요\n3. 변경사항을 커밋하고 푸시하세요`,
                          labels: ['automated', 'data-update']
                        });
                      }

            - name: Upload check result
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: no-dividend-check-result
                  path: check_result.txt
                  retention-days: 30
