name: Collect incremental data v2 candidate

on:
  schedule:
    # Hourly dispatcher. It fetches only source URLs currently due; GitHub cron is UTC.
    - cron: '0 * * * 0-5'
  workflow_dispatch:
    inputs:
      backfill:
        description: Optional official historical source target (provider:YYYY-MM-DD ex-date)
        required: false
        type: string
      inspect_release:
        description: Only inspect uploaded release objects and pointer (no collection or writes)
        required: false
        type: string
      configure_core_cors:
        description: Add Yieldloom production read origin while preserving bucket CORS
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: collect-incremental-data-v2
  cancel-in-progress: false

jobs:
  configure-cors:
    if: inputs.configure_core_cors
    runs-on: ubuntu-latest
    environment: data-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install boto3
      - name: Add production read origin
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python scripts/data_v2/configure_cors.py --apply
  inspect:
    if: inputs.inspect_release != '' && !inputs.configure_core_cors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install boto3
      - name: Inspect release upload without writes
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          RELEASE_ID: ${{ inputs.inspect_release }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from scripts.cloud.r2_helper import get_r2_client
          release_id = os.environ['RELEASE_ID']
          if not re.fullmatch(r'[A-Za-z0-9._-]+', release_id):
              raise ValueError('Invalid release ID')
          client, bucket = get_r2_client()
          prefix = 'core/releases/' + release_id + '/'
          pages = client.get_paginator('list_objects_v2').paginate(Bucket=bucket, Prefix=prefix)
          objects = [row for page in pages for row in page.get('Contents', [])]
          manifest_exists = any(row['Key'] == prefix + 'manifest.json' for row in objects)
          try:
              pointer = json.loads(client.get_object(Bucket=bucket, Key='core/current.json')['Body'].read())
          except client.exceptions.NoSuchKey:
              pointer = {}
          result = {'releaseId': release_id, 'uploadedObjects': len(objects),
                    'uploadedBytes': sum(row['Size'] for row in objects),
                    'manifestExists': manifest_exists, 'currentReleaseId': pointer.get('releaseId')}
          print('::notice title=Core release upload status::' + json.dumps(result))
          try:
              cors = client.get_bucket_cors(Bucket=bucket).get('CORSRules', [])
              print('::notice title=Core bucket CORS rules::' + json.dumps(cors))
          except Exception as error:
              code = getattr(error, 'response', {}).get('Error', {}).get('Code', type(error).__name__)
              print('::warning title=Core bucket CORS lookup::' + str(code))
          PY
  collect:
    if: inputs.inspect_release == '' && !inputs.configure_core_cors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-workflow.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements-workflow.txt
      - name: Install browser collection runtime
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Collect changed official documents and persist state
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          BACKFILL_TARGET: ${{ inputs.backfill }}
        shell: bash
        run: |
          args=()
          if [ -n "$BACKFILL_TARGET" ]; then args+=(--backfill "$BACKFILL_TARGET"); fi
          python scripts/data_v2/prepare_incremental_candidate.py --run-id "${{ github.run_id }}" "${args[@]}"
      - name: Validate complete candidate snapshot
        run: |
          python scripts/data_v2/build_release.py --input data-v2/candidates/incremental-events.json --catalog-input data-v2/catalog-seed.json --release-id "candidate-${{ github.run_id }}" --output candidate-release
          python scripts/data_v2/validate_snapshot.py --data-dir candidate-release
      - name: Render review summary
        if: always()
        run: |
          python scripts/data_v2/render_incremental_report.py
          cat data-v2/review/incremental-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incremental-data-v2-review-${{ github.run_id }}
          path: |
            data-v2/candidates/incremental-events.json
            data-v2/catalog-seed.json
            data-v2/review/incremental-report.json
            data-v2/review/incremental-report.md
            candidate-release/
          if-no-files-found: warn
          retention-days: 30
      - name: Report source collection failures
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data-v2/review/incremental-report.json')
          if path.exists():
              report = json.loads(path.read_text(encoding='utf-8'))
              failures = report.get('summary', {}).get('failedSources', 0)
              if failures:
                  for provider, details in report.get('providers', {}).items():
                      for error in details.get('errors', []):
                          print(f'{provider}: {error}')
                  print(f'::error::{failures} source collections failed; inspect the review artifact before publishing.')
                  raise SystemExit(1)
          PY
