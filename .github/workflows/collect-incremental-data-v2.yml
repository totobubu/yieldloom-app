name: Collect incremental data v2 candidate

on:
  schedule:
    # Hourly dispatcher. It fetches only source URLs currently due; GitHub cron is UTC.
    - cron: '0 * * * 0-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-incremental-data-v2
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-workflow.txt
      - run: pip install -r requirements-workflow.txt
      - name: Collect changed official documents and persist state
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python scripts/data_v2/prepare_incremental_candidate.py --run-id "${{ github.run_id }}"
      - name: Validate complete candidate snapshot
        run: |
          python scripts/data_v2/build_release.py --input data-v2/candidates/incremental-events.json --catalog-input data-v2/catalog-seed.json --release-id "candidate-${{ github.run_id }}" --output candidate-release
          python scripts/data_v2/validate_snapshot.py --data-dir candidate-release
      - name: Render review summary
        if: always()
        run: python scripts/data_v2/render_incremental_report.py
      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incremental-data-v2-review-${{ github.run_id }}
          path: |
            data-v2/candidates/incremental-events.json
            data-v2/catalog-seed.json
            data-v2/review/incremental-report.json
            data-v2/review/incremental-report.md
            candidate-release/
          if-no-files-found: warn
          retention-days: 30
