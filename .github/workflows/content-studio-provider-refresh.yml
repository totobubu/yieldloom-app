name: Content Studio provider refresh

run-name: content-refresh:${{ inputs.provider || github.event.schedule || inputs.scope || 'all' }}:${{ inputs.requestId || github.run_id }}

on:
  # Every entry maps to one provider below.  Times are UTC; the first four
  # are weekday KST morning observation windows for weekly distributors.
  schedule:
    - cron: '15 22 * * 0-4' # yieldmax
    - cron: '25 22 * * 0-4' # defiance
    - cron: '35 22 * * 0-4' # roundhill
    - cron: '45 22 * * 0-4' # rex
    - cron: '05 0 * * 1-5'  # globalx
    - cron: '15 0 * * 1-5'  # amplify
    - cron: '25 0 * * 1-5'  # neos
    - cron: '35 0 * * 1-5'  # jpmorgan
    - cron: '45 0 * * 1-5'  # schwab
    - cron: '05 2 1-7 * *' # firsttrust, early-month monthly window
    - cron: '15 2 8-14 * *' # graniteshares, second-week monthly window
    - cron: '25 2 15-21 * *' # ishares, mid-month monthly window
    - cron: '35 2 22-28 * *' # kurv, late-month monthly window
    - cron: '45 2 1-7 * *' # proshares, early-month monthly window
    - cron: '55 2 1-7 * *' # statestreet, early-month quarterly observation
  workflow_dispatch:
    inputs:
      requestId:
        description: Correlation id generated by the refresh API
        required: false
        type: string
      scope:
        description: Refresh scope
        required: true
        default: provider
        type: choice
        options: [all, provider, ticker, ex_date, render]
      provider:
        description: Provider for provider refresh
        required: false
        type: string
      ticker:
        description: Existing ticker for a targeted refresh
        required: false
        type: string
      exDate:
        description: ISO ex-dividend date for a date-scoped refresh
        required: false
        type: string
      eventId:
        description: Existing render event id
        required: false
        type: string

permissions:
  contents: write

# The public snapshot is a single ledger. Provider runs are independent
# workflow runs, but writes are serialized so one provider cannot overwrite
# another provider's restored R2 state.
concurrency:
  group: content-studio-state-write
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/codex/')
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      EVENT_SCHEDULE: ${{ github.event.schedule }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Resolve provider refresh target
        id: target
        shell: bash
        run: |
          scope='${{ inputs.scope }}'
          provider='${{ inputs.provider }}'
          if [[ -n "$EVENT_SCHEDULE" ]]; then
            scope='provider'
            case "$EVENT_SCHEDULE" in
              '15 22 * * 0-4') provider='yieldmax' ;;
              '25 22 * * 0-4') provider='defiance' ;;
              '35 22 * * 0-4') provider='roundhill' ;;
              '45 22 * * 0-4') provider='rex' ;;
              '05 0 * * 1-5') provider='globalx' ;;
              '15 0 * * 1-5') provider='amplify' ;;
              '25 0 * * 1-5') provider='neos' ;;
              '35 0 * * 1-5') provider='jpmorgan' ;;
              '45 0 * * 1-5') provider='schwab' ;;
              '05 2 1-7 * *') provider='firsttrust' ;;
              '15 2 8-14 * *') provider='graniteshares' ;;
              '25 2 15-21 * *') provider='ishares' ;;
              '35 2 22-28 * *') provider='kurv' ;;
              '45 2 1-7 * *') provider='proshares' ;;
              '55 2 1-7 * *') provider='statestreet' ;;
              *) echo "Unsupported scheduled target: $EVENT_SCHEDULE" >&2; exit 1 ;;
            esac
          fi
          scope="${scope:-all}"
          if [[ "$scope" == 'provider' && -z "$provider" ]]; then
            echo 'A provider is required for provider refreshes.' >&2
            exit 1
          fi
          if [[ -n "$provider" ]]; then
            case "$provider" in
              amplify|defiance|firsttrust|globalx|graniteshares|ishares|jpmorgan|kurv|neos|proshares|rex|roundhill|schwab|statestreet|yieldmax) ;;
              *) echo "Unsupported provider: $provider" >&2; exit 1 ;;
            esac
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
          echo "label=${provider:-$scope}" >> "$GITHUB_OUTPUT"

      - name: Select durable state
        id: state
        shell: bash
        run: |
          state_key='content-studio/state/latest.tar.gz'
          if [[ "$GITHUB_REF_NAME" != 'main' ]]; then
            safe_ref="${GITHUB_REF_NAME//\//-}"
            state_key="content-studio/state/branches/${safe_ref}.tar.gz"
          fi
          echo "CONTENT_STATE_KEY=$state_key" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: |
          pip install -r requirements-workflow.txt
          npm ci --no-audit --no-fund

      - name: Restore durable Content Studio state
        id: restore
        if: ${{ steps.target.outputs.scope != 'render' }}
        run: python scripts/content_pipeline/content_state_store.py restore --key "$CONTENT_STATE_KEY"

      - name: Install collection and render browser
        run: npx playwright install --with-deps chromium

      - name: Refresh official data
        id: refresh
        if: ${{ steps.target.outputs.scope != 'render' }}
        continue-on-error: true
        shell: bash
        run: |
          args=(--scope '${{ steps.target.outputs.scope }}' --request-id '${{ inputs.requestId }}')
          if [[ '${{ steps.target.outputs.scope }}' == 'provider' ]]; then args+=(--provider '${{ steps.target.outputs.provider }}'); fi
          if [[ '${{ steps.target.outputs.scope }}' == 'ticker' ]]; then args+=(--ticker '${{ inputs.ticker }}'); fi
          if [[ '${{ steps.target.outputs.scope }}' == 'ex_date' ]]; then args+=(--ex-date '${{ inputs.exDate }}'); fi
          python scripts/content_pipeline/refresh.py "${args[@]}"

      - name: Capture licensed fallback observation after official ticker failure
        id: fallback
        if: ${{ steps.refresh.outcome == 'failure' && steps.target.outputs.scope == 'ticker' }}
        continue-on-error: true
        shell: bash
        run: |
          echo 'captured=false' >> "$GITHUB_OUTPUT"
          if [[ -z "$MASSIVE_API_KEY" ]]; then exit 0; fi
          python scripts/content_pipeline/collect_fallback.py --service massive --ticker '${{ inputs.ticker }}'
          python scripts/content_pipeline/export_admin_data.py
          python scripts/content_pipeline/export_dashboard.py
          echo 'captured=true' >> "$GITHUB_OUTPUT"

      - name: Generate one PNG
        id: render
        if: ${{ steps.target.outputs.scope == 'render' }}
        continue-on-error: true
        run: node scripts/content_pipeline/render_public_event.mjs '${{ inputs.eventId }}'

      - name: Save durable Content Studio state
        if: ${{ always() && steps.target.outputs.scope != 'render' && steps.restore.outcome == 'success' }}
        run: python scripts/content_pipeline/content_state_store.py save --key "$CONTENT_STATE_KEY"

      - name: Validate generated snapshots
        id: validate
        if: ${{ always() && (steps.restore.outcome == 'success' || steps.render.outcome == 'success') }}
        continue-on-error: true
        run: python scripts/content_pipeline/validate_refresh_outputs.py

      - name: Commit public Content Studio outputs
        if: ${{ always() && steps.validate.outcome == 'success' }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/content-studio/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh Content Studio data [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Report refresh failure
        if: ${{ always() && (steps.refresh.outcome == 'failure' || steps.render.outcome == 'failure' || steps.validate.outcome == 'failure') }}
        run: exit 1
