name: Content Studio Refresh
run-name: content-refresh:${{ (github.event_name == 'schedule' || inputs.canary) && 'canary' || (inputs.scope || 'all') }}:${{ (github.event_name == 'schedule' || inputs.canary) && 'statestreet' || (inputs.provider || inputs.ticker || inputs.exDate || inputs.eventId || 'all') }}:${{ inputs.requestId || github.run_id }}

on:
    schedule:
        - cron: '30 22 * * 1-5'
    workflow_dispatch:
        inputs:
            requestId:
                description: Correlation id generated by the refresh API
                required: false
                type: string
            canary:
                description: Run the branch-safe one-provider canary
                required: false
                default: false
                type: boolean
            scope:
                description: Refresh scope
                required: true
                default: all
                type: choice
                options: [all, provider, ticker, ex_date, render]
            provider:
                description: Allowed provider slug for provider refresh
                required: false
                type: string
            ticker:
                description: Existing ticker for a targeted refresh
                required: false
                type: string
            exDate:
                description: ISO ex-dividend date for a date-scoped refresh
                required: false
                type: string
            eventId:
                description: Existing render event id
                required: false
                type: string

permissions:
    contents: write

concurrency:
    group: repository-generated-data-write
    cancel-in-progress: false

jobs:
    refresh:
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/codex/')
        runs-on: ubuntu-latest
        env:
            R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
            R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
            R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
            R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
            MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 10

            - name: Select isolated durable state
              shell: bash
              run: |
                  state_key="content-studio/state/latest.tar.gz"
                  if [[ "$GITHUB_REF_NAME" != "main" ]]; then
                      safe_ref="${GITHUB_REF_NAME//\//-}"
                      state_key="content-studio/state/branches/${safe_ref}.tar.gz"
                  fi
                  echo "CONTENT_STATE_KEY=$state_key" >> "$GITHUB_ENV"

            - uses: actions/setup-python@v5
              with:
                  python-version: '3.11'
                  cache: pip

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: npm

            - name: Install dependencies
              run: |
                  pip install -r requirements-workflow.txt
                  npm ci --no-audit --no-fund

            - name: Restore durable Content Studio state
              if: ${{ inputs.scope != 'render' }}
              run: python scripts/content_pipeline/content_state_store.py restore --key "$CONTENT_STATE_KEY"

            - name: Install collection and render browser
              run: npx playwright install --with-deps chromium

            - name: Refresh official data
              id: refresh
              if: ${{ inputs.scope != 'render' }}
              continue-on-error: true
              shell: bash
              run: |
                  scope="${{ (github.event_name == 'schedule' || inputs.canary) && 'provider' || (inputs.scope || 'all') }}"
                  provider="${{ (github.event_name == 'schedule' || inputs.canary) && 'statestreet' || inputs.provider }}"
                  args=(--scope "$scope" --request-id "${{ inputs.requestId }}")
                  if [[ "$scope" == "provider" ]]; then args+=(--provider "$provider"); fi
                  if [[ "$scope" == "ticker" ]]; then args+=(--ticker "${{ inputs.ticker }}"); fi
                  if [[ "$scope" == "ex_date" ]]; then args+=(--ex-date "${{ inputs.exDate }}"); fi
                  python scripts/content_pipeline/refresh.py "${args[@]}"

            - name: Capture licensed fallback observation after official ticker failure
              id: fallback
              if: ${{ steps.refresh.outcome == 'failure' && inputs.scope == 'ticker' }}
              continue-on-error: true
              shell: bash
              run: |
                  echo "captured=false" >> "$GITHUB_OUTPUT"
                  if [[ -z "$MASSIVE_API_KEY" ]]; then
                      echo "MASSIVE_API_KEY is not configured; fallback observation skipped"
                      exit 0
                  fi
                  python scripts/content_pipeline/collect_fallback.py --service massive --ticker "${{ inputs.ticker }}"
                  python scripts/content_pipeline/export_admin_data.py
                  python scripts/content_pipeline/export_dashboard.py
                  echo "captured=true" >> "$GITHUB_OUTPUT"

            - name: Generate one PNG
              id: render
              if: ${{ inputs.scope == 'render' }}
              continue-on-error: true
              run: node scripts/content_pipeline/render_public_event.mjs "${{ inputs.eventId }}"

            - name: Record successful canary evidence
              if: ${{ steps.refresh.outcome == 'success' && (github.event_name == 'schedule' || inputs.canary) }}
              run: >-
                  python scripts/content_pipeline/record_canary_evidence.py
                  --provider statestreet
                  --ref "$GITHUB_REF_NAME"
                  --run-id "$GITHUB_RUN_ID"
                  --sha "$GITHUB_SHA"

            - name: Record render result
              if: ${{ always() && inputs.scope == 'render' }}
              run: |
                  status="success"
                  message="PNG generated"
                  if [[ "${{ steps.render.outcome }}" != "success" ]]; then status="failed"; message="PNG generation failed"; fi
                  python scripts/content_pipeline/append_public_log.py --request-id "${{ inputs.requestId }}" --scope render --event-id "${{ inputs.eventId }}" --status "$status" --message "$message"

            - name: Save durable Content Studio state
              if: ${{ always() && inputs.scope != 'render' && (steps.refresh.outcome == 'success' || steps.fallback.outputs.captured == 'true') }}
              run: python scripts/content_pipeline/content_state_store.py save --key "$CONTENT_STATE_KEY"

            - name: Validate generated snapshots
              if: ${{ always() && (steps.refresh.outcome == 'success' || steps.fallback.outputs.captured == 'true') }}
              run: python scripts/content_pipeline/validate_refresh_outputs.py

            - name: Commit public Content Studio outputs
              if: ${{ always() && (steps.refresh.outcome == 'success' || steps.fallback.outputs.captured == 'true' || steps.render.outcome == 'success') }}
              shell: bash
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add public/content-studio/
                  if git diff --cached --quiet; then exit 0; fi
                  git commit -m "chore: refresh Content Studio data [skip ci]"
                  git push origin "HEAD:${GITHUB_REF_NAME}"

            - name: Report refresh failure
              if: ${{ always() && (steps.refresh.outcome == 'failure' || steps.render.outcome == 'failure') }}
              run: exit 1
