name: Content Studio Refresh
run-name: content-refresh:${{ inputs.scope || 'all' }}:${{ inputs.provider || inputs.ticker || inputs.eventId || 'all' }}:${{ inputs.requestId || github.run_id }}

on:
    schedule:
        - cron: '30 22 * * 1-5'
    workflow_dispatch:
        inputs:
            requestId:
                description: Correlation id generated by the refresh API
                required: false
                type: string
            scope:
                description: Refresh scope
                required: true
                default: all
                type: choice
                options: [all, provider, ticker, render]
            provider:
                description: Allowed provider slug for provider refresh
                required: false
                type: string
            ticker:
                description: Existing ticker for a targeted refresh
                required: false
                type: string
            eventId:
                description: Existing render event id
                required: false
                type: string

permissions:
    contents: write

concurrency:
    group: repository-generated-data-write
    cancel-in-progress: false

jobs:
    refresh:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        env:
            R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
            R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
            R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
            R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 10

            - uses: actions/setup-python@v5
              with:
                  python-version: '3.11'
                  cache: pip

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: npm

            - name: Install dependencies
              run: |
                  pip install -r requirements-workflow.txt
                  npm ci --no-audit --no-fund

            - name: Restore durable Content Studio state
              if: ${{ inputs.scope != 'render' }}
              run: python scripts/content_pipeline/content_state_store.py restore

            - name: Install render browser
              if: ${{ inputs.scope == 'render' }}
              run: npx playwright install --with-deps chromium

            - name: Refresh official data
              id: refresh
              if: ${{ inputs.scope != 'render' }}
              continue-on-error: true
              shell: bash
              run: |
                  scope="${{ inputs.scope || 'all' }}"
                  args=(--scope "$scope" --request-id "${{ inputs.requestId }}")
                  if [[ "$scope" == "provider" ]]; then args+=(--provider "${{ inputs.provider }}"); fi
                  if [[ "$scope" == "ticker" ]]; then args+=(--ticker "${{ inputs.ticker }}"); fi
                  python scripts/content_pipeline/refresh.py "${args[@]}"

            - name: Generate one PNG
              id: render
              if: ${{ inputs.scope == 'render' }}
              continue-on-error: true
              run: node scripts/content_pipeline/render_public_event.mjs "${{ inputs.eventId }}"

            - name: Record render result
              if: ${{ always() && inputs.scope == 'render' }}
              run: |
                  status="success"
                  message="PNG generated"
                  if [[ "${{ steps.render.outcome }}" != "success" ]]; then status="failed"; message="PNG generation failed"; fi
                  python scripts/content_pipeline/append_public_log.py --request-id "${{ inputs.requestId }}" --scope render --event-id "${{ inputs.eventId }}" --status "$status" --message "$message"

            - name: Save durable Content Studio state
              if: ${{ always() && inputs.scope != 'render' }}
              run: python scripts/content_pipeline/content_state_store.py save

            - name: Commit public Content Studio outputs
              if: ${{ always() }}
              shell: bash
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add public/content-studio/
                  if git diff --cached --quiet; then exit 0; fi
                  git commit -m "chore: refresh Content Studio data [skip ci]"
                  git push origin HEAD:main

            - name: Report refresh failure
              if: ${{ always() && (steps.refresh.outcome == 'failure' || steps.render.outcome == 'failure') }}
              run: exit 1
