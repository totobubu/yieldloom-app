name: Approved synthetic Dropbox shadow probe

on:
    push:
        branches: [test/dropbox-synthetic-shadow]
        paths: ['.github/workflows/dividend-archive-smoke.yml']
    workflow_dispatch:
        inputs:
            confirm_synthetic_shadow_write:
                description: Write only two synthetic files in the isolated shadow verification directory
                type: boolean
                required: true
                default: false
            resume_probe_run_id:
                description: Optional existing probe ID; must still contain exact original synthetic bytes and no receipt
                type: string
                required: false
                default: ''
            sharing_checked_run_id:
                description: Only after approved reader checks the same existing run and every ancestor with no shared folders or links
                type: string
                required: false
                default: ''

permissions:
    contents: read

concurrency:
    group: dropbox-shadow-storage-probe
    cancel-in-progress: false

jobs:
    verify:
        # First creation of this explicitly approved test branch only. Subsequent
        # pushes cannot repeat a write. Manual reruns require a unique attempt ID.
        if: >-
            github.repository == 'totobubu/yieldloom-app' &&
            github.ref == 'refs/heads/test/dropbox-synthetic-shadow' &&
            ((github.event_name == 'push' && github.event.created == true) ||
             (github.event_name == 'workflow_dispatch' && inputs.confirm_synthetic_shadow_write == true))
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.11'
            - name: Verify probe code without credentials
              run: python -m unittest discover -s tests/dividend_archive -v
            - name: Read account and sharing context then test only synthetic files
              env:
                  DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
                  DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
                  DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
                  PROBE_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
                  PROBE_RESUME_ID: ${{ inputs.resume_probe_run_id }}
                  PROBE_SHARING_CHECKED_ID: ${{ inputs.sharing_checked_run_id }}
              shell: bash
              run: |
                  set -euo pipefail
                  args=(--apply --refresh)
                  if [ -n "$PROBE_RESUME_ID" ]; then
                    args+=(--run-id "$PROBE_RESUME_ID" --resume-original)
                  else
                    args+=(--run-id "$PROBE_RUN_ID")
                  fi
                  if [ -n "$PROBE_SHARING_CHECKED_ID" ]; then
                    args+=(--sharing-checked-run-id "$PROBE_SHARING_CHECKED_ID")
                  fi
                  python -m scripts.dividend_archive.smoke "${args[@]}"
            # No original data access, artifacts, cleanup, grants or deployments.
