name: Observe Roundhill MAGY Thursday announcement

on:
  schedule:
    # Asia/Seoul Thursday 19:45–20:30, every five minutes (GitHub cron is UTC).
    - cron: '45,50,55 10 * * 4'
    - cron: '0,5,10,15,20,25,30 11 * * 4'
    # Recovery: Thursday 21:00 and Friday 09:00 KST.
    - cron: '0 12 * * 4'
    - cron: '0 0 * * 5'
  workflow_dispatch:
    inputs:
      declarationDate:
        description: Thursday declaration date (YYYY-MM-DD); Wednesday also allowed for early announcements
        required: false
        type: string

permissions:
  contents: write

# Share the existing writer lock: restore/read/modify/save must stay together.
concurrency:
  group: content-studio-state-write
  cancel-in-progress: false

jobs:
  observe:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/codex/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      DECLARATION_DATE: ${{ inputs.declarationDate }}
      EVENT_SCHEDULE: ${{ github.event.schedule }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install collection dependencies
        run: pip install -r requirements-workflow.txt

      - name: Select durable state
        shell: bash
        run: |
          state_key='content-studio/state/latest.tar.gz'
          if [[ "$GITHUB_REF_NAME" != 'main' ]]; then
            safe_ref="${GITHUB_REF_NAME//\//-}"
            state_key="content-studio/state/branches/${safe_ref}.tar.gz"
          fi
          echo "CONTENT_STATE_KEY=$state_key" >> "$GITHUB_ENV"

      - name: Restore durable Content Studio state
        id: restore
        run: python scripts/content_pipeline/content_state_store.py restore --key "$CONTENT_STATE_KEY"

      - name: Observe this Thursday's MAGY notice
        id: observation
        continue-on-error: true
        shell: bash
        run: |
          args=(--github-output "$GITHUB_OUTPUT")
          if [[ -n "$DECLARATION_DATE" ]]; then args+=(--declaration-date "$DECLARATION_DATE"); fi
          if [[ "$EVENT_SCHEDULE" == '0 0 * * 5' ]]; then args+=(--require-announcement); fi
          python scripts/content_pipeline/observe_roundhill.py --ticker MAGY "${args[@]}"

      - name: Validate generated snapshots
        id: validate
        if: ${{ always() && steps.observation.outputs.attempted == 'true' }}
        continue-on-error: true
        run: python scripts/content_pipeline/validate_refresh_outputs.py

      - name: Save durable Content Studio state
        if: ${{ always() && steps.restore.outcome == 'success' && steps.observation.outputs.attempted == 'true' }}
        run: python scripts/content_pipeline/content_state_store.py save --key "$CONTENT_STATE_KEY"

      - name: Commit public Content Studio outputs
        if: ${{ always() && steps.validate.outcome == 'success' }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/content_pipeline/publish_public_snapshots.sh "$GITHUB_REF_NAME"

      - name: Upload observation audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: magy-observation-${{ github.run_id }}
          path: var/content-studio/magy-observation.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Report observation status
        if: ${{ always() }}
        env:
          OBSERVATION_STATUS: ${{ steps.observation.outputs.status }}
          OBSERVATION_OUTCOME: ${{ steps.observation.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        shell: bash
        run: |
          echo "MAGY observation: ${OBSERVATION_STATUS:-not_run}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$OBSERVATION_OUTCOME" == 'failure' || "$VALIDATION_OUTCOME" == 'failure' ]]; then exit 1; fi
