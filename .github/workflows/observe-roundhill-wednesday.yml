name: Observe Roundhill Wednesday announcements

on:
  schedule:
    # Asia/Seoul Wednesday 19:45–20:30, every five minutes.
    - cron: '45,50,55 10 * * 3'
    - cron: '0,5,10,15,20,25,30 11 * * 3'
    # Recovery at 21:00 and the following day 09:00 KST.
    - cron: '0 12 * * 3'
    - cron: '0 0 * * 4'
  workflow_dispatch:
    inputs:
      declarationDate:
        description: Declaration date (YYYY-MM-DD); blank uses the most recent scheduled day in Seoul
        required: false
        type: string

permissions:
  contents: write

jobs:
  observe:
    uses: ./.github/workflows/observe-roundhill-group.yml
    with:
      group: zero-dte
      declarationDate: ${{ inputs.declarationDate || '' }}
      requireAnnouncement: ${{ github.event.schedule == '0 0 * * 4' }}
    secrets: inherit
