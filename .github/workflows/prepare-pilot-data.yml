name: Prepare reviewed data v2 candidate

on:
  workflow_dispatch:
    inputs:
      providers:
        description: Comma-separated providers to collect from official sources
        required: true
        default: roundhill,neos
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-data-v2
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-workflow.txt
      - run: pip install -r requirements-workflow.txt
      - name: Collect official candidate
        shell: bash
        run: |
          args=()
          IFS=',' read -ra providers <<< "${{ inputs.providers }}"
          for provider in "${providers[@]}"; do args+=(--provider "$provider"); done
          python scripts/data_v2/collect_pilot.py "${args[@]}"
      - name: Build and validate candidate release
        run: |
          python scripts/data_v2/build_release.py --release-id "candidate-${{ github.run_id }}" --output candidate-release
          python scripts/data_v2/validate_snapshot.py --data-dir candidate-release
      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-v2-candidate-${{ github.run_id }}
          path: |
            data-v2/candidates/pilot-events.json
            candidate-release/
          if-no-files-found: warn
          retention-days: 30
