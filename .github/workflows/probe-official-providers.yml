name: Probe official dividend providers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe-official-providers
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-workflow.txt
      - run: pip install -r requirements-workflow.txt
      - run: python scripts/data_v2/probe_providers.py --output provider-probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: official-provider-probe-${{ github.run_id }}
          path: provider-probe.json
          retention-days: 30
