name: Publish approved data v2 release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Approved manifest releaseId to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-data-v2
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: data-production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-workflow.txt
      - run: pip install -r requirements-workflow.txt
      - run: python scripts/data_v2/validate_snapshot.py
      - name: Publish immutable snapshot and current pointer
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python scripts/data_v2/publish_release.py --release-id "${{ inputs.release_id }}"
