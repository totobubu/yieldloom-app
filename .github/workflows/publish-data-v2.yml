name: Publish approved data v2 release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Approved manifest releaseId to publish
        required: true
        type: string
      candidate_run_id:
        description: Reviewed incremental collection workflow run ID
        required: false
        type: string
      review_only:
        description: Compare candidate using current catalog without publishing
        required: false
        default: false
        type: boolean
      verify_public:
        description: Also verify the published release and browser CORS
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-data-v2
  cancel-in-progress: false

jobs:
  review:
    if: inputs.review_only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require collection candidate
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: test -n "$CANDIDATE_RUN_ID"
      - name: Download collection candidate
        uses: actions/download-artifact@v4
        with:
          name: incremental-data-v2-review-${{ inputs.candidate_run_id }}
          path: reviewed-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Rebuild with current independent catalog
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: >-
          python scripts/data_v2/build_release.py
          --input reviewed-candidate/data-v2/candidates/incremental-events.json
          --catalog-input data-v2/catalog-seed.json
          --release-id "$RELEASE_ID"
          --output reviewed-release
      - name: Compare full dividend history
        run: python scripts/data_v2/check_cutover.py --data-dir reviewed-release --output dividend-cutover.json
      - uses: actions/setup-node@v4
        if: inputs.verify_public
        with:
          node-version: '24'
      - name: Verify published consumer assets
        if: inputs.verify_public
        env:
          PUBLIC_RELEASE_BASE_URL: ${{ vars.VITE_R2_PUBLIC_URL }}
          EXPECTED_RELEASE_ID: ${{ inputs.release_id }}
        run: node scripts/data_v2/verify_public_release.mjs
      - name: Expose review result
        if: always()
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          path = Path('dividend-cutover.json')
          collection_path = Path('reviewed-candidate/data-v2/review/incremental-report.json')
          if collection_path.exists():
              collection = json.loads(collection_path.read_text())
              print('::notice title=Collection summary::' + json.dumps(collection['summary']))
              for provider, details in collection.get('providers', {}).items():
                  errors = details.get('errors', [])
                  if errors:
                      message = json.dumps({'provider': provider, 'errors': errors[:8]}, ensure_ascii=False)
                      escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f'::notice title=Collection source errors::{escaped}')
          if path.exists():
              report = json.loads(path.read_text())
              summary = {key: report[key] for key in ('ready', 'snapshotValid', 'summary')}
              summary['missingByProvider'] = dict(Counter(row['provider'] for row in report['missing']))
              summary['changedFields'] = dict(Counter(field for row in report['changed'] for field in row['fields']))
              summary['changedSample'] = report['changed'][:3]
              summary['missingEvents'] = [
                  [row['provider'], row['ticker'], row['declaredDate'], row['exDate']]
                  for row in report['missing']
              ][:30]
              message = json.dumps(summary, ensure_ascii=False)
              escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::notice title=Dividend cutover review::{escaped}')
              with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a') as output:
                  output.write('```json\n' + json.dumps(summary, ensure_ascii=False, indent=2) + '\n```\n')
          PY
      - name: Upload reviewed snapshot and comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dividend-cutover-review-${{ github.run_id }}
          path: |
            dividend-cutover.json
            reviewed-release/
          if-no-files-found: ignore
  publish:
    if: github.ref == 'refs/heads/main' && !inputs.review_only
    runs-on: ubuntu-latest
    environment: data-production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-workflow.txt
      - run: pip install -r requirements-workflow.txt
      - name: Download reviewed candidate artifact
        if: inputs.candidate_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: incremental-data-v2-review-${{ inputs.candidate_run_id }}
          path: reviewed-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Validate approved snapshot
        run: |
          if [ -n "${{ inputs.candidate_run_id }}" ]; then
            python scripts/data_v2/validate_snapshot.py --data-dir reviewed-candidate/candidate-release
          else
            python scripts/data_v2/validate_snapshot.py
          fi
      - name: Compare approved release against existing dividend history
        shell: bash
        run: |
          release_dir=data-v2
          if [ -n "${{ inputs.candidate_run_id }}" ]; then release_dir=reviewed-candidate/candidate-release; fi
          python scripts/data_v2/check_cutover.py --data-dir "$release_dir" --output dividend-cutover.json
      - name: Upload dividend cutover report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dividend-cutover-${{ github.run_id }}
          path: dividend-cutover.json
          if-no-files-found: ignore
      - name: Publish immutable snapshot and current pointer
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          if [ -n "${{ inputs.candidate_run_id }}" ]; then
            python scripts/data_v2/publish_release.py --release-id "${{ inputs.release_id }}" --data-dir reviewed-candidate/candidate-release
          else
            python scripts/data_v2/publish_release.py --release-id "${{ inputs.release_id }}"
          fi
