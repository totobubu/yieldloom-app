name: Refresh thumbnail projections
on:
  schedule:
    - cron: '30 1 * * 2-6'
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Comma-separated tickers, or ALL for the reviewed source directory'
        required: false
        default: 'AMDY,TSLY,TOPW,AAPL,TSLA'
        type: string
permissions:
  contents: read
concurrency:
  group: thumbnail-projection-publish
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build, validate and publish changed read models to R2
        env:
          THUMBNAIL_SOURCE_BASE_URL: ${{ vars.THUMBNAIL_SOURCE_BASE_URL || secrets.R2_PUBLIC_URL || vars.VITE_R2_PUBLIC_URL }}
          VITE_R2_PUBLIC_URL: ${{ vars.VITE_R2_PUBLIC_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          PROJECTION_SYMBOLS: ${{ inputs.symbols || vars.THUMBNAIL_PROJECTION_SYMBOLS || 'AMDY,TSLY,TOPW,AAPL,TSLA' }}
        shell: bash
        run: |
          args=()
          if [[ -n "$PROJECTION_SYMBOLS" && "$PROJECTION_SYMBOLS" != "ALL" ]]; then args+=(--symbols "$PROJECTION_SYMBOLS"); fi
          node scripts/thumbnail_pipeline/refresh.mjs "${args[@]}"
