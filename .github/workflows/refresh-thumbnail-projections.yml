name: Refresh thumbnail projections
on:
  schedule:
    # Leave room for the upstream 23:00 UTC collection and delayed R2 uploads.
    - cron: '30 3 * * 2-6'
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Leave blank to use repository settings; comma-separated tickers or ALL to override'
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: thumbnail-projection-publish
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build, validate and publish changed read models to R2
        env:
          THUMBNAIL_SOURCE_BASE_URL: ${{ vars.THUMBNAIL_SOURCE_BASE_URL || secrets.R2_PUBLIC_URL || vars.VITE_R2_PUBLIC_URL }}
          VITE_R2_PUBLIC_URL: ${{ vars.VITE_R2_PUBLIC_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          PROJECTION_SYMBOLS: ${{ inputs.symbols || vars.THUMBNAIL_PROJECTION_SYMBOLS || 'AMDY,TSLY,TOPW,AAPL,TSLA' }}
          INPUT_SYMBOLS: ${{ inputs.symbols }}
        shell: bash
        run: |
          args=()
          symbols="${PROJECTION_SYMBOLS//[[:space:]]/}"
          if [[ "${symbols^^}" == "ALL" && -z "$INPUT_SYMBOLS" ]]; then
            symbols='AMDY,TSLY,TOPW,AAPL,TSLA'
            echo '::warning::Repository setting ALL is too broad for the scheduled refresh; using the reviewed default symbol set. Pass ALL explicitly through workflow_dispatch for a full refresh.'
          fi
          if [[ -n "$symbols" && "${symbols^^}" != "ALL" ]]; then args+=(--symbols "$symbols"); fi
          node scripts/thumbnail_pipeline/refresh.mjs "${args[@]}" > thumbnail-projection-report.json
      - name: Summarize projection refresh
        if: always()
        shell: bash
        run: |
          python - <<'PYREPORT'
          import json
          import os
          from pathlib import Path
          report_path = Path('thumbnail-projection-report.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              if not report_path.exists() or not report_path.read_text().strip():
                  summary.write('Projection report unavailable. Inspect the failed setup or refresh step.\n')
              else:
                  report = json.loads(report_path.read_text())
                  summary.write('## Projection refresh\n\n')
                  for key in ('changed', 'unchanged', 'rejected', 'skipped'):
                      summary.write(f'- {key}: {len(report.get(key, []))}\n')
                  rejected = report.get('rejected', [])
                  if rejected:
                      summary.write('\n### Rejected sources\n\n')
                      for row in rejected:
                          # Escape source messages before displaying them in Markdown.
                          import html
                          symbol = html.escape(str(row['symbol']))
                          reason = html.escape(str(row['reason']))
                          retained = 'yes' if row.get('retainedPrevious') else 'no'
                          summary.write(f'- <code>{symbol}</code>: <code>{reason}</code> (previous retained: {retained})\n')
          PYREPORT
      - name: Upload projection refresh report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thumbnail-projection-review-${{ github.run_id }}
          path: thumbnail-projection-report.json
          if-no-files-found: ignore
          retention-days: 14
