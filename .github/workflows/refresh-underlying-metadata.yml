name: Refresh verified ETF underlyings

on:
  schedule:
    - cron: '20 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: verified-underlying-metadata
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install lxml
      - run: npm ci --no-audit --no-fund
      - name: Collect official metadata and register verified additions
        shell: bash
        run: |
          set +e
          python scripts/metadata/underlyings.py --collect --apply
          result=$?
          set -e
          if [ "$result" -eq 2 ]; then
            echo '::warning::Some sources or changes need review; existing links were retained. See the audit artifact.'
          elif [ "$result" -ne 0 ]; then
            exit "$result"
          fi
      - name: Verify registry and regenerate classifications
        run: |
          python scripts/metadata/apply_reviews.py --url 'https://yieldloom-app.vercel.app/api/security-metadata?action=export' --apply
          python -m unittest discover -s tests/metadata -v
          node --test tests/security_underlyings.test.mjs tests/metadata_reviews.test.mjs tests/platform_enhancements.test.mjs
          npm run export:portfolio-classifications
          npm run type-check
      - name: Attach audit and evidence cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: underlying-metadata-audit-${{ github.run_id }}
          path: |
            docs/data-management/underlying-audit.json
            data-v2/security-underlyings.json
            data-v2/collection-health.json
            var/data-management/underlying-sources/
          retention-days: 30
      - name: Commit verified metadata
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data-v2/security-underlyings.json data-v2/catalog-seed.json data-v2/collection-health.json public/portfolio-classifications.json docs/data-management/underlying-audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh verified ETF underlyings'
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      # GITHUB_TOKEN commits do not trigger push workflows; request the Pages build explicitly.
      - name: Rebuild Pages with updated metadata
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
        run: gh workflow run deploy-pages.yml --ref main -f release_sha="$RELEASE_SHA"
      - name: Trigger configured Vercel deploy hook
        if: steps.commit.outputs.changed == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          python - <<'PY'
          import os, urllib.request
          hook = os.environ.get('DEPLOY_HOOK')
          if hook:
              try:
                  with urllib.request.urlopen(urllib.request.Request(hook, data=b'', method='POST'), timeout=30) as response:
                      if response.status >= 300:
                          raise RuntimeError()
              except Exception:
                  raise SystemExit('Vercel deploy hook failed; check the configured integration.')
          else:
              print('Using the existing Vercel Git integration.')
          PY
      - name: Verify both production sites use the same commit and metadata
        if: steps.commit.outputs.changed == 'true'
        env:
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
        run: node scripts/deploy/verify-release.mjs --sha "$RELEASE_SHA"
