# .github/workflows/upload_to_r2.yml

name: Manual Upload to R2

on:
    workflow_dispatch:
        inputs:
            upload_mode:
                description: '업로드 모드'
                required: true
                default: 'changed'
                type: choice
                options:
                    - changed
                    - full_sync
                    - specific
            specific_files:
                description: '특정 파일 (모드가 specific일 때만, 공백으로 구분)'
                required: false
                type: string
                default: ''

permissions:
    # Uploading a selected Git revision must never create an unrelated commit.
    contents: read

jobs:
    upload-r2:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout main branch
              uses: actions/checkout@v4

            - name: Free Disk Space
              run: |
                  sudo rm -rf /usr/local/lib/android
                  sudo rm -rf /usr/share/dotnet
                  sudo rm -rf /opt/ghc
                  sudo rm -rf /usr/local/share/boost
                  sudo rm -rf "$AGENT_TOOLSDIRECTORY"

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'
                  cache: 'pip'
                  cache-dependency-path: 'requirements-workflow.txt'

            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements-workflow.txt

            - name: Setup R2 environment variables
              run: |
                  echo "R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}" >> $GITHUB_ENV
                  echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> $GITHUB_ENV
                  echo "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
                  echo "R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}" >> $GITHUB_ENV
                  echo "R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}" >> $GITHUB_ENV
                  echo "✅ R2 환경변수 설정 완료"

            # --- R2 업로드 ---
            - name: Upload to R2 (Changed Files - Fast) ⚡
              if: inputs.upload_mode == 'changed'
              run: |
                  echo "📤 [모드: 변경된 파일만] Git 기반 빠른 업로드..."
                  python scripts/cloud/upload_changed_to_r2.py
                  echo "✅ 업로드 완료 (쾌속)"

            - name: Upload to R2 (Full Sync - Slow) 🔧
              if: inputs.upload_mode == 'full_sync'
              run: |
                  echo "📤 [모드: 전체 동기화] R2와 로컬 전체 비교 & 업로드..."
                  python scripts/cloud/upload_full_sync_to_r2.py
                  echo "✅ 전체 동기화 완료"

            - name: Upload to R2 (Specific Files) 🎯
              if: inputs.upload_mode == 'specific'
              run: |
                  echo "📤 [모드: 특정 파일] 지정된 파일만 업로드..."
                  if [ -z "${{ inputs.specific_files }}" ]; then
                    echo "❌ 오류: specific_files 입력이 비어있습니다."
                    echo "💡 사용법: public/nav.json public/data/aapl.json"
                    exit 1
                  fi
                  python scripts/cloud/upload_specific_to_r2.py ${{ inputs.specific_files }}
                  echo "✅ 특정 파일 업로드 완료"
