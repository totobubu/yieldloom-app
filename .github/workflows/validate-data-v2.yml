name: Validate data v2

on:
  pull_request:
    paths:
      - 'data-v2/**'
      - 'scripts/data_v2/**'
      - 'tests/data_v2/**'
      - '.github/workflows/validate-data-v2.yml'
  push:
    branches: [main]
    paths:
      - 'data-v2/**'
      - 'scripts/data_v2/**'
      - 'tests/data_v2/**'
      - '.github/workflows/validate-data-v2.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install boto3==1.43.116 pytesseract Pillow
      - run: python scripts/data_v2/validate_snapshot.py --allow-bootstrap
      - run: python -m unittest discover -s tests/data_v2 -v
