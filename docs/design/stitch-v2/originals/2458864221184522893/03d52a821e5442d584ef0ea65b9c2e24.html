<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V2 SHELL / Mobile / Navigation Closed</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/primeicons@6.0.1/primeicons.css">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f7f9fb;
      color: #1e293b;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden w-[390px] max-w-[390px] mx-auto bg-[#f7f9fb] pb-[76px]">

  <!-- Mobile Top Header (h-56px, 390px viewport) -->
  <header class="w-full bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="h-14 px-4 flex items-center justify-between">
      <!-- Left: Logo & Brand Name -->
      <a href="#" class="flex items-center gap-2 group">
        <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuATiHMItvmqZSKkBXH9Zn4AoQreV0w2U76y-Dhxdf6UG8gqJkQGaahw4c7KfG3Rpv_BnBYgfSHquB1O3aFFFXsM0lKmdWaZJy0PqbZgVnPBhpBvdEpzuYL92hUXPsEu4m_Gdv_0bnt9UeKkB31Xq2CAocg-YnSA8-mALCNxlt7w2OmGZSsW5-aIKr3_Cn-KT-XGFIvWr7969SEtOT6l-gGzrXBriuOI04xjAk0nCle43-Lf3jMnmFuw" alt="모으멍 배당달력" class="w-7 h-7 rounded-md object-contain" />
        <span class="font-bold text-sm tracking-tight text-slate-900">
          모으멍 <span class="text-[#0d7a6e]">배당달력</span>
        </span>
      </a>

      <!-- Right: Submenu Closed Pill & Admin Drawer Trigger (Touch targets 44px) -->
      <div class="flex items-center gap-1.5">
        <!-- Submenu Trigger Button (Closed State) -->
        <button type="button" aria-label="서브메뉴 열기" class="h-9 px-2.5 rounded-lg border border-slate-200 bg-slate-50 hover:bg-emerald-50 text-slate-700 text-xs font-semibold flex items-center gap-1 transition-colors">
          <span class="text-[#0d7a6e] font-bold">개요 · 원금</span>
          <i class="pi pi-chevron-down text-[9px] text-slate-400"></i>
        </button>

        <!-- Admin Account Drawer Trigger (Closed State) -->
        <button type="button" aria-label="관리자 계정 메뉴 열기" class="w-10 h-10 rounded-lg flex items-center justify-center text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition-colors">
          <span class="w-7 h-7 rounded-full bg-emerald-50 border border-emerald-200 flex items-center justify-center text-[#0d7a6e]">
            <i class="pi pi-user text-xs"></i>
          </span>
        </button>
      </div>
    </div>

    <!-- Mobile Submenu Location Badge / Path (Compact) -->
    <div class="px-4 py-1.5 bg-slate-50 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-500">
      <div class="flex items-center gap-1">
        <span class="font-medium text-slate-600">포트폴리오</span>
        <span class="text-slate-300">&gt;</span>
        <span class="text-slate-600">개요</span>
        <span class="text-slate-300">&gt;</span>
        <span class="text-[#0d7a6e] font-bold">원금</span>
      </div>
      <span class="text-[10px] text-slate-400">메뉴 닫힘</span>
    </div>
  </header>

  <!-- Mobile Blank Main Content Slot (358px inner width, 16px side padding) -->
  <main class="w-full flex-1 px-4 py-4 flex flex-col">
    <div class="w-full flex-1 min-h-[520px] rounded-2xl border-2 border-dashed border-slate-200 bg-white/50 flex flex-col items-center justify-center p-6 text-center transition-colors">
      <div class="w-11 h-11 rounded-xl bg-emerald-50 border border-emerald-100 flex items-center justify-center text-[#0d7a6e] mb-2.5 shadow-sm">
        <i class="pi pi-box text-lg"></i>
      </div>
      <p class="text-sm font-semibold text-slate-700 tracking-tight">콘텐츠 영역</p>
      <p class="text-[11px] text-slate-400 mt-1 max-w-[260px] font-normal leading-relaxed">
        본 프레임은 모바일 전역 셸(상단 헤더 + 하단 내비게이션 + 푸터)이 조립된 닫힘 상태입니다.
      </p>
    </div>
  </main>

  <!-- Mobile Product Footer -->
  <footer class="w-full bg-white border-t border-slate-200 py-3 px-4 text-center">
    <div class="text-[11px] font-semibold text-slate-700">모으멍 배당달력</div>
    <div class="text-[10px] text-slate-500 mt-0.5">데이터 출처 · 이용 안내</div>
    <div class="text-[9px] text-slate-400 mt-1 leading-tight">
      공개된 자료를 정리한 정보입니다.<br/>기준일과 원문을 확인해 주세요.
    </div>
  </footer>

  <!-- Fixed Mobile Bottom Navigation Bar (h-16, 64px + safe-area) -->
  <nav aria-label="모바일 하단 내비게이션" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-[390px] h-16 bg-white/95 backdrop-blur border-t border-slate-200 px-2 flex items-center justify-around z-20 shadow-lg">
    <!-- Public Menu: Stock Search -->
    <a href="#" class="flex flex-col items-center justify-center w-16 h-12 text-slate-400 hover:text-slate-700 transition-colors">
      <i class="pi pi-search text-base mb-1"></i>
      <span class="text-[10px] font-medium">종목 검색</span>
    </a>

    <!-- Public Menu: Compare -->
    <a href="#" class="flex flex-col items-center justify-center w-16 h-12 text-slate-400 hover:text-slate-700 transition-colors">
      <i class="pi pi-sliders-h text-base mb-1"></i>
      <span class="text-[10px] font-medium">종목 비교</span>
    </a>

    <!-- Authorized Menu: Portfolio (Current Active Group) -->
    <a href="#" class="flex flex-col items-center justify-center w-16 h-12 text-[#0d7a6e] font-semibold transition-colors">
      <div class="relative">
        <i class="pi pi-wallet text-base mb-1"></i>
        <span class="absolute -top-1 -right-1 w-2 h-2 rounded-full bg-[#eab308]"></span>
      </div>
      <span class="text-[10px] font-bold">포트폴리오</span>
    </a>

    <!-- Authorized Menu: Simulator -->
    <a href="#" class="flex flex-col items-center justify-center w-16 h-12 text-slate-400 hover:text-slate-700 transition-colors">
      <i class="pi pi-calculator text-base mb-1"></i>
      <span class="text-[10px] font-medium">시뮬레이터</span>
    </a>

    <!-- Public Menu: Guide / Info -->
    <a href="#" class="flex flex-col items-center justify-center w-16 h-12 text-slate-400 hover:text-slate-700 transition-colors">
      <i class="pi pi-question-circle text-base mb-1"></i>
      <span class="text-[10px] font-medium">이용 안내</span>
    </a>
  </nav>

</body>
</html>
