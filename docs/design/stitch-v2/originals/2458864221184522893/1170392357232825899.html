<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V2 SHELL / PC / Submenu Open</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/primeicons@6.0.1/primeicons.css">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", sans-serif; }
  .tabular-nums { font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="bg-[#f8fafc] text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- Global Header (PC 1280px) -->
  <header class="h-16 bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
    <div class="w-full max-w-[1280px] mx-auto px-6 h-full flex items-center justify-between">
      <!-- Logo + Brand -->
      <div class="flex items-center gap-8">
        <a href="#" class="flex items-center gap-2.5 focus:outline-hidden focus:ring-2 focus:ring-[#0d7a6e] rounded-lg p-1">
          <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuCXRy9GykKwoROEy5WitiSyUynNVweqrxpMPDIdfjbvJoHhXOsh2xuPLT2vHbkpvr_H9mhAdAH0wK1jaKd52AZYl3eMgPb5NrTLnWFbUjoyzxQiYYeK4XLomVeqy_kde6uv67J0gGwb941ODx2JFXhJVRmFq8qyUe52y4ESABD9u2Zx3XNFhQxQip1iQpX7kU3lG7NX02kdoE6nlUBuaqUhGDxirK6SZtI4qGJAC4rfKTZalWpsX0QB" alt="모으멍 심볼" class="w-8 h-8 object-contain">
          <span class="font-bold text-lg tracking-tight text-slate-900">모으멍 <span class="text-[#0d7a6e]">배당달력</span></span>
        </a>

        <!-- Global Public Nav Links -->
        <nav class="hidden md:flex items-center gap-1 text-sm font-medium text-slate-600">
          <a href="#" class="px-3.5 py-2 rounded-lg hover:text-[#0d7a6e] hover:bg-emerald-50 transition">종목 검색</a>
          <a href="#" class="px-3.5 py-2 rounded-lg hover:text-[#0d7a6e] hover:bg-emerald-50 transition">종목 비교</a>
          <a href="#" class="px-3.5 py-2 rounded-lg hover:text-[#0d7a6e] hover:bg-emerald-50 transition">신규 상장</a>
          <a href="#" class="px-3.5 py-2 rounded-lg hover:text-[#0d7a6e] hover:bg-emerald-50 transition">이용 안내</a>
        </nav>
      </div>

      <!-- Right Header Actions (Authenticated Admin State) -->
      <div class="flex items-center gap-3">
        <!-- Theme Toggle -->
        <button type="button" aria-label="화면 모드 전환" class="w-9 h-9 rounded-lg border border-slate-200 flex items-center justify-center text-slate-500 hover:text-slate-800 hover:bg-slate-100 transition focus:outline-hidden focus:ring-2 focus:ring-[#0d7a6e]">
          <i class="pi pi-sun text-sm"></i>
        </button>

        <!-- Admin Authenticated Indicator & Account Drawer Trigger -->
        <button type="button" class="flex items-center gap-2.5 pl-3 pr-2.5 py-1.5 rounded-lg border border-emerald-200 bg-emerald-50/60 hover:bg-emerald-100/70 text-slate-700 transition focus:outline-hidden focus:ring-2 focus:ring-[#0d7a6e]">
          <span class="inline-flex items-center gap-1.5 text-xs font-semibold text-[#0d7a6e]">
            <span class="w-2 h-2 rounded-full bg-[#0d7a6e] animate-pulse"></span>
            관리자
          </span>
          <span class="text-xs text-slate-400">|</span>
          <span class="text-xs font-medium text-slate-700">계정 메뉴</span>
          <i class="pi pi-angle-down text-xs text-slate-500"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Shell Body Container with 224px Left Submenu + Main Slot -->
  <div class="flex-1 w-full max-w-[1280px] mx-auto px-6 py-6 flex gap-6">

    <!-- Left 224px Sub Menu (Portfolio Navigation Expanded) -->
    <aside class="w-[224px] shrink-0 bg-white border border-slate-200 rounded-xl p-3 shadow-xs flex flex-col justify-between self-start sticky top-22">
      <div class="space-y-4">
        <!-- Root Section Header -->
        <div class="px-2 pt-1 flex items-center justify-between">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-400">내 작업 공간</span>
          <span class="px-1.5 py-0.5 text-[10px] font-semibold bg-[#eab308]/15 text-[#92400e] rounded">인증됨</span>
        </div>

        <!-- Portfolio Group (Open) -->
        <div class="space-y-1">
          <div class="flex items-center justify-between px-2.5 py-2 text-sm font-bold text-slate-900 rounded-lg bg-slate-50">
            <span class="flex items-center gap-2">
              <i class="pi pi-chart-pie text-[#0d7a6e]"></i>
              포트폴리오
            </span>
            <i class="pi pi-chevron-down text-xs text-slate-500"></i>
          </div>

          <!-- Tree Sub-items -->
          <div class="pl-3 pr-1 pt-1 space-y-0.5 border-l-2 border-slate-100 ml-3.5">
            <!-- 1. 개요 (Expanded) -->
            <div>
              <div class="flex items-center justify-between px-2 py-1.5 text-xs font-semibold text-slate-700">
                <span>개요</span>
                <i class="pi pi-chevron-down text-[10px] text-slate-400"></i>
              </div>
              <div class="pl-2 space-y-0.5">
                <a href="#" class="block px-2.5 py-1.5 text-xs rounded-md text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition">요약</a>
                <a href="#" class="block px-2.5 py-1.5 text-xs rounded-md text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition">보유 종목</a>
                <!-- SELECTED ITEM: 원금 -->
                <a href="#" aria-current="page" class="flex items-center justify-between px-2.5 py-1.5 text-xs font-bold rounded-md bg-[#0d7a6e] text-white shadow-xs">
                  <span>원금</span>
                  <i class="pi pi-check text-[10px]"></i>
                </a>
              </div>
            </div>

            <!-- 2. 캘린더 -->
            <a href="#" class="flex items-center gap-2 px-2 py-1.5 text-xs font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-50 rounded-md transition">
              <i class="pi pi-calendar text-[11px] text-slate-400"></i>
              캘린더
            </a>

            <!-- 3. 분석 -->
            <a href="#" class="flex items-center gap-2 px-2 py-1.5 text-xs font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-50 rounded-md transition">
              <i class="pi pi-chart-line text-[11px] text-slate-400"></i>
              분석
            </a>

            <!-- 4. 자산 관리 (자금 및 원장) -->
            <a href="#" class="flex items-center gap-2 px-2 py-1.5 text-xs font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-50 rounded-md transition">
              <i class="pi pi-wallet text-[11px] text-slate-400"></i>
              자산 관리
            </a>
          </div>
        </div>

        <!-- Simulator Link -->
        <div class="pt-2 border-t border-slate-100">
          <a href="#" class="flex items-center gap-2 px-2.5 py-2 text-xs font-medium text-slate-600 hover:text-[#0d7a6e] hover:bg-emerald-50 rounded-lg transition">
            <i class="pi pi-calculator text-slate-400"></i>
            배당 시뮬레이터
          </a>
        </div>
      </div>

      <!-- Bottom Status -->
      <div class="pt-3 border-t border-slate-100 text-[11px] text-slate-400 px-2 flex items-center justify-between">
        <span>선택: 개요 &gt; 원금</span>
        <i class="pi pi-info-circle"></i>
      </div>
    </aside>

    <!-- Main Empty Content Slot (max-w-[1120px] boundary compliant) -->
    <main class="flex-1 min-w-0">
      <div class="w-full h-full min-h-[560px] border-2 border-dashed border-slate-300 rounded-2xl bg-white/60 p-12 flex flex-col items-center justify-center text-center">
        <div class="w-14 h-14 rounded-2xl bg-emerald-50 border border-emerald-100 flex items-center justify-center text-[#0d7a6e] mb-4 shadow-xs">
          <i class="pi pi-box text-2xl"></i>
        </div>
        <h2 class="text-base font-bold text-slate-700 mb-1">콘텐츠 영역 · 별도 콘텐츠 프레임 삽입</h2>
        <p class="text-xs text-slate-400 max-w-md leading-relaxed">
          본 프레임은 전역 셸(상단 헤더 + 좌측 224px 서브메뉴)이 활성화된 상태입니다.<br>
          개별 화면 콘텐츠(원금 회수율, 계좌 테이블, 필터 등)는 이 슬롯 내부로 삽입됩니다.
        </p>
      </div>
    </main>
  </div>

  <!-- Global Footer -->
  <footer class="mt-auto bg-white border-t border-slate-200 py-6 text-xs text-slate-500">
    <div class="w-full max-w-[1280px] mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="flex items-center gap-4">
        <span class="font-semibold text-slate-700">모으멍 배당달력</span>
        <span class="text-slate-300">|</span>
        <a href="#" class="hover:text-slate-800 transition">데이터 출처 · 이용 안내</a>
      </div>
      <p class="text-slate-400 text-center sm:text-right">
        공개된 자료를 정리한 정보입니다. 기준일과 원문을 확인해 주세요.
      </p>
    </div>
  </footer>

</body>
</html>
