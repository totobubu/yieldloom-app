<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V2 SHELL / Tablet / Submenu Open</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/primeicons@6.0.1/primeicons.css">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", sans-serif; width: 768px; margin: 0 auto; overflow-x: hidden; }
</style>
</head>
<body class="bg-[#f8fafc] text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- Tablet Header (768px) -->
  <header class="h-16 bg-white border-b border-slate-200 sticky top-0 z-30 px-6 flex items-center justify-between">
    <div class="flex items-center gap-4">
      <a href="#" class="flex items-center gap-2 focus:outline-hidden">
        <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuCXRy9GykKwoROEy5WitiSyUynNVweqrxpMPDIdfjbvJoHhXOsh2xuPLT2vHbkpvr_H9mhAdAH0wK1jaKd52AZYl3eMgPb5NrTLnWFbUjoyzxQiYYeK4XLomVeqy_kde6uv67J0gGwb941ODx2JFXhJVRmFq8qyUe52y4ESABD9u2Zx3XNFhQxQip1iQpX7kU3lG7NX02kdoE6nlUBuaqUhGDxirK6SZtI4qGJAC4rfKTZalWpsX0QB" alt="모으멍 심볼" class="w-7 h-7 object-contain">
        <span class="font-bold text-base tracking-tight text-slate-900">모으멍 <span class="text-[#0d7a6e]">배당달력</span></span>
      </a>

      <!-- Compact Public Nav -->
      <nav class="flex items-center gap-1 text-xs font-medium text-slate-600">
        <a href="#" class="px-2.5 py-1.5 rounded-md hover:text-[#0d7a6e] hover:bg-emerald-50 transition">검색</a>
        <a href="#" class="px-2.5 py-1.5 rounded-md hover:text-[#0d7a6e] hover:bg-emerald-50 transition">비교</a>
        <a href="#" class="px-2.5 py-1.5 rounded-md hover:text-[#0d7a6e] hover:bg-emerald-50 transition">신규 상장</a>
      </nav>
    </div>

    <!-- Right Controls -->
    <div class="flex items-center gap-2">
      <button type="button" aria-label="모드 전환" class="w-11 h-11 rounded-lg border border-slate-200 flex items-center justify-center text-slate-500 hover:bg-slate-50">
        <i class="pi pi-sun text-sm"></i>
      </button>
      <button type="button" class="h-11 px-3 rounded-lg border border-emerald-200 bg-emerald-50/70 text-slate-700 flex items-center gap-2 text-xs font-semibold">
        <span class="w-2 h-2 rounded-full bg-[#0d7a6e]"></span>
        <span>관리자</span>
        <i class="pi pi-bars text-xs"></i>
      </button>
    </div>
  </header>

  <!-- Tablet Submenu Bar & Expanded Popover Panel -->
  <section class="bg-white border-b border-slate-200 px-6 py-2.5 z-20">
    <div class="flex items-center justify-between">
      <!-- Breadcrumb / Active Trigger Button (Submenu Active) -->
      <div class="flex items-center gap-2">
        <span class="text-xs font-semibold text-slate-400">포트폴리오</span>
        <i class="pi pi-angle-right text-[10px] text-slate-300"></i>
        <!-- Expanded Trigger -->
        <button type="button" class="h-11 px-3.5 rounded-lg bg-[#0d7a6e] text-white flex items-center gap-2 text-xs font-bold shadow-xs">
          <i class="pi pi-chart-pie text-xs"></i>
          <span>개요 · 원금 (선택됨)</span>
          <i class="pi pi-chevron-up text-[10px]"></i>
        </button>
      </div>

      <span class="text-[11px] font-medium text-slate-400">서브메뉴 펼침 상태</span>
    </div>

    <!-- Visible Expanded Sub Menu Panel for Tablet -->
    <div class="mt-3 p-4 bg-slate-50 border border-slate-200 rounded-xl shadow-xs">
      <div class="grid grid-cols-4 gap-3">
        <!-- Col 1: 개요 Group (Active) -->
        <div class="bg-white p-3 rounded-lg border border-emerald-200 shadow-2xs">
          <div class="flex items-center justify-between text-xs font-bold text-[#0d7a6e] mb-2 pb-1.5 border-b border-emerald-100">
            <span>개요</span>
            <span class="w-1.5 h-1.5 rounded-full bg-[#0d7a6e]"></span>
          </div>
          <div class="space-y-1">
            <a href="#" class="block px-2.5 py-1.5 text-xs text-slate-600 hover:bg-slate-50 rounded-md">요약</a>
            <a href="#" class="block px-2.5 py-1.5 text-xs text-slate-600 hover:bg-slate-50 rounded-md">보유 종목</a>
            <!-- Selected Item -->
            <a href="#" aria-current="page" class="flex items-center justify-between px-2.5 py-1.5 text-xs font-bold bg-[#0d7a6e] text-white rounded-md">
              <span>원금</span>
              <i class="pi pi-check text-[10px]"></i>
            </a>
          </div>
        </div>

        <!-- Col 2: 캘린더 -->
        <div class="bg-white p-3 rounded-lg border border-slate-200">
          <div class="text-xs font-bold text-slate-700 mb-2 pb-1.5 border-b border-slate-100">캘린더</div>
          <div class="space-y-1">
            <a href="#" class="block px-2.5 py-1.5 text-xs text-slate-600 hover:bg-slate-50 rounded-md">월별 배당 일정</a>
            <a href="#" class="block px-2.5 py-1.5 text-xs text-slate-600 hover:bg-slate-50 rounded-md">배당락일 캘린더</a>
          </div>
        </div>

        <!-- Col 3: 분석 -->
        <div class="bg-white p-3 rounded-lg border border-slate-200">
          <div class="text-xs font-bold text-slate-700 mb-2 pb-1.5 border-b border-slate-100">분석</div>
          <div class="space-y-1">
            <a href="#" class="block px-2.5 py-1.5 text-xs text-slate-600 hover:bg-slate-50 rounded-md">종목 집중도 (HHI)</a>
            <a href="#" class="block px-2.5 py-1.5 text-xs text-slate-600 hover:bg-slate-50 rounded-md">배당 성장률</a>
          </div>
        </div>

        <!-- Col 4: 자산 관리 -->
        <div class="bg-white p-3 rounded-lg border border-slate-200">
          <div class="text-xs font-bold text-slate-700 mb-2 pb-1.5 border-b border-slate-100">자산 관리</div>
          <div class="space-y-1">
            <a href="#" class="block px-2.5 py-1.5 text-xs text-slate-600 hover:bg-slate-50 rounded-md">명의자 및 계좌</a>
            <a href="#" class="block px-2.5 py-1.5 text-xs text-slate-600 hover:bg-slate-50 rounded-md">수동 잔고 보정</a>
            <a href="#" class="block px-2.5 py-1.5 text-xs text-slate-600 hover:bg-slate-50 rounded-md">자금 입출금 흐름</a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Empty Main Slot (Tablet max-w-720px / px-6) -->
  <main class="flex-1 w-full max-w-[720px] mx-auto px-6 py-6">
    <div class="w-full h-full min-h-[460px] border-2 border-dashed border-slate-300 rounded-2xl bg-white/60 p-8 flex flex-col items-center justify-center text-center">
      <div class="w-12 h-12 rounded-xl bg-emerald-50 border border-emerald-100 flex items-center justify-center text-[#0d7a6e] mb-3">
        <i class="pi pi-box text-xl"></i>
      </div>
      <h2 class="text-sm font-bold text-slate-700 mb-1">콘텐츠 영역 · 별도 콘텐츠 프레임 삽입</h2>
      <p class="text-xs text-slate-400 max-w-sm leading-relaxed">
        태블릿 폭(768px, 콘텐츠 안쪽 720px) 기준 공통 셸이며 서브메뉴가 상단 드롭패널로 펼쳐진 상태입니다.
      </p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="mt-auto bg-white border-t border-slate-200 py-5 px-6 text-xs text-slate-500">
    <div class="max-w-[720px] mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
      <div class="flex items-center gap-3">
        <span class="font-semibold text-slate-700">모으멍 배당달력</span>
        <span class="text-slate-300">|</span>
        <a href="#" class="hover:text-slate-800 transition">데이터 출처 · 이용 안내</a>
      </div>
      <p class="text-slate-400 text-center sm:text-right">
        공개된 자료를 정리한 정보입니다. 기준일과 원문을 확인해 주세요.
      </p>
    </div>
  </footer>

</body>
</html>
