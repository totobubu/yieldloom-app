<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V2 SHELL / Tablet / Navigation Closed</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/primeicons@6.0.1/primeicons.css">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f7f9fb;
      color: #1e293b;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden w-[768px] max-w-[768px] mx-auto bg-[#f7f9fb]">

  <!-- Compact Top Global Header (Tablet 768px) -->
  <header class="w-full bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-[720px] mx-auto h-16 px-6 flex items-center justify-between">
      <!-- Left: Logo & Title -->
      <div class="flex items-center gap-3">
        <!-- Global Navigation Drawer Closed Button (44px touch target) -->
        <button type="button" aria-label="전역 메뉴 열기" class="w-11 h-11 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 flex items-center justify-center text-slate-700 transition-colors shadow-sm">
          <i class="pi pi-bars text-base"></i>
        </button>

        <a href="#" class="flex items-center gap-2 group">
          <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuATiHMItvmqZSKkBXH9Zn4AoQreV0w2U76y-Dhxdf6UG8gqJkQGaahw4c7KfG3Rpv_BnBYgfSHquB1O3aFFFXsM0lKmdWaZJy0PqbZgVnPBhpBvdEpzuYL92hUXPsEu4m_Gdv_0bnt9UeKkB31Xq2CAocg-YnSA8-mALCNxlt7w2OmGZSsW5-aIKr3_Cn-KT-XGFIvWr7969SEtOT6l-gGzrXBriuOI04xjAk0nCle43-Lf3jMnmFuw" alt="모으멍 배당달력" class="w-7 h-7 rounded-md object-contain" />
          <span class="font-bold text-base tracking-tight text-slate-900">
            모으멍 <span class="text-[#0d7a6e]">배당달력</span>
          </span>
        </a>
      </div>

      <!-- Right: Theme + Admin Account Trigger -->
      <div class="flex items-center gap-2.5">
        <button type="button" aria-label="테마 전환" class="w-11 h-11 rounded-lg border border-slate-200 flex items-center justify-center text-slate-500 hover:text-slate-800 hover:bg-slate-50 transition-colors">
          <i class="pi pi-sun text-sm"></i>
        </button>

        <!-- Admin Account Button (Closed Drawer Trigger, 44px min height) -->
        <button type="button" aria-label="관리자 계정 메뉴" class="h-11 px-3.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 flex items-center gap-2 text-xs font-semibold text-slate-700 transition-colors shadow-sm">
          <span class="w-2 h-2 rounded-full bg-[#0d7a6e]"></span>
          <span>관리자</span>
          <i class="pi pi-chevron-down text-[10px] text-slate-400"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Submenu Closed Bar + Main Content Slot -->
  <div class="w-full max-w-[720px] mx-auto px-6 flex-1 flex flex-col py-5 gap-4">

    <!-- Submenu Location / Closed Trigger Bar (Touch 44px) -->
    <div class="h-12 px-4 bg-white rounded-xl border border-slate-200/80 shadow-sm flex items-center justify-between">
      <!-- Breadcrumb indicator -->
      <div class="flex items-center gap-2 text-xs">
        <span class="text-slate-500 font-medium">포트폴리오</span>
        <i class="pi pi-angle-right text-[10px] text-slate-300"></i>
        <span class="text-slate-500 font-medium">개요</span>
        <i class="pi pi-angle-right text-[10px] text-slate-300"></i>
        <span class="text-[#0d7a6e] font-bold bg-emerald-50 px-2 py-0.5 rounded border border-emerald-100">원금</span>
      </div>

      <!-- Closed Trigger button to open Submenu panel (No backdrop, closed state) -->
      <button type="button" aria-label="서브메뉴 펼치기" class="h-9 px-3 rounded-lg border border-slate-200 bg-slate-50 hover:bg-emerald-50 hover:text-[#0d7a6e] text-slate-700 text-xs font-semibold flex items-center gap-1.5 transition-colors">
        <span>개요 · 원금</span>
        <i class="pi pi-chevron-down text-[10px] text-slate-400"></i>
      </button>
    </div>

    <!-- Blank Main Slot (Tablet 720px max width, 24px side padding) -->
    <main class="w-full flex-1 min-h-[620px] rounded-2xl border-2 border-dashed border-slate-200 bg-white/50 flex flex-col items-center justify-center p-8 text-center transition-colors">
      <div class="w-12 h-12 rounded-2xl bg-emerald-50 border border-emerald-100 flex items-center justify-center text-[#0d7a6e] mb-3 shadow-sm">
        <i class="pi pi-box text-xl"></i>
      </div>
      <p class="text-sm font-semibold text-slate-700 tracking-tight">콘텐츠 영역</p>
      <p class="text-xs text-slate-400 mt-1 max-w-sm font-normal">
        본 프레임은 전역 셸(태블릿 헤더 + 닫힌 서브메뉴 트리거 + 푸터)이 조립된 닫힘 상태입니다.
      </p>
    </main>

  </div>

  <!-- Standard Product Footer -->
  <footer class="w-full bg-white border-t border-slate-200 py-4 mt-auto">
    <div class="max-w-[720px] mx-auto px-6 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-500 gap-2">
      <div class="flex items-center gap-3">
        <span class="font-semibold text-slate-700">모으멍 배당달력</span>
        <span class="text-slate-300">|</span>
        <a href="#" class="hover:text-slate-800 transition-colors">데이터 출처 · 이용 안내</a>
      </div>
      <div class="text-slate-400 text-right">
        공개된 자료를 정리한 정보입니다. 기준일과 원문을 확인해 주세요.
      </div>
    </div>
  </footer>

</body>
</html>
