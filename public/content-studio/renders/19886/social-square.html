<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OARK 배당 카드</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 1080px; height: 1080px; overflow: hidden; }
body { font-family: Pretendard, "Noto Sans KR", Arial, sans-serif; background: #081321; color: #f7f9fc; }
.card { position: relative; display: flex; flex-direction: column; justify-content: space-between; width: 100%; height: 100%; padding: 59px; background: radial-gradient(circle at 90% 4%, #244b68 0, transparent 34%), linear-gradient(145deg, #081321 0%, #10283b 100%); }
.card::after { content: ""; position: absolute; right: -9%; bottom: -20%; width: 48%; aspect-ratio: 1; border: 6px solid rgba(255,190,82,.22); border-radius: 50%; }
.top { display: flex; justify-content: space-between; align-items: center; font-size: 24px; font-weight: 800; letter-spacing: .08em; color: #ffbd52; }
.provider { color: #ffbd52; letter-spacing: .04em; } .byline { color: #b9c8d7; letter-spacing: .02em; font-size: .9em; }
.main { width:100%; align-self:stretch; padding-top: 0px; }
.headline { display:flex; align-items:end; justify-content:space-between; gap:27px; }
.ticker { margin: 0; font-size: 140px; line-height: .9; letter-spacing: -.05em; }
.amount-block { text-align:right; }
.label { margin: 0 0 8px; font-size: 24px; color: #b9c8d7; }
.amount { margin: 0; color: #fff; font-size: 108px; font-weight: 900; letter-spacing: -.055em; white-space:nowrap; }
.change { display: inline-block; margin-top: 11px; padding: 9px 15px; border: 1px solid rgba(255,189,82,.45); border-radius: 999px; color: #ffd78f; font-size: 19px; font-weight: 800; }
.amount-change { margin: 11px 0 0; color: #dce7f2; font-size: 19px; font-weight: 700; }
.monthly { margin-top: 38px; padding: 16px; border-radius: 15px; background: rgba(255,255,255,.94); color: #172033; }
.month-row { display:grid; grid-template-columns: 89px 117px 1fr; gap: 10px; align-items:center; min-height:32px; border-top:1px solid #e8ecf1; font-size:17px; }
.month-row strong { color:#344054; } .month-row b { color:#101828; } .pills { display:flex; gap:6px; } .pill { flex:1; padding:8px 6px; border-radius:6px; color:#fff; text-align:center; font-weight:900; font-size:17px; }
.blue{background:#4386ed}.red{background:#e3483f}.yellow{background:#eab308;color:#172033}.green{background:#22a45d}.orange{background:#e87918}
.bottom { width:100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding-top: 38px; border-top: 1px solid rgba(255,255,255,.16); }
.date span { display: block; margin-bottom: 5px; color: #8fa5b7; font-size: 19px; }
.date strong { font-size: 43px; }

.top-with-source { display:grid; grid-template-columns:1fr auto; gap:10px; }
.source-meta { grid-column:1/-1; display:flex; gap:8px; align-items:center; flex-wrap:wrap; color:#dce7f2; font-size:16px; font-weight:800; letter-spacing:0; }
.source-meta span { padding:4px 10px; border:1px solid rgba(255,255,255,.22); border-radius:999px; }
.source-meta .verified { border-color:rgba(255,189,82,.65); color:#ffd78f; }
</style>
</head>
<body>
<main class="card" data-content-card data-source-class="issuer_official" data-verification-status="official">
  <header class="top top-with-source">
	<span class="provider">261008 YIELDMAX</span>
	<span class="byline">Made by 토또부부</span>
    <div class="source-meta"><span class="verified">공식 확인</span><span>운용사 공식</span><span>yieldmax</span><span>원문 소수 4자리</span></div>
  </header>
  <section class="main">
	<div class="headline">
		<h1 class="ticker">OARK</h1>
	</div>
	<div class="amount-block">
		<p class="amount">$0.1672</p>
		<p class="amount-change">직전 $0.2036 → 이번 $0.1672</p>
		<span class="change">직전 대비 -17.9% | - $0.0364</span>
	</div>
  </section>
	
	<footer class="bottom">
		<div class="date"><span>배당공시일</span><strong>261007</strong></div>
		<div class="date"><span>배당락일</span><strong>261008</strong></div>
		<div class="date"><span>지급일</span><strong>261009</strong></div>
	</footer>
</main>
</body>
</html>
