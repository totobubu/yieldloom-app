<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Yieldloom 로컬 토스 연결</title>
        <link rel="stylesheet" href="/app.css" />
    </head>
    <body>
        <main>
            <h1>이 PC의 토스 API 연결</h1>
            <p>
                토스 비밀키와 암호는 이 로컬 프로그램에만 전달합니다.
                웹사이트·Git·로그에 저장하지 않습니다.
            </p>
            <section>
                <h2>웹앱 연결 코드</h2>
                <p>
                    같은 PC의 Yieldloom 계좌 설정에서 아래 코드를 입력하세요.
                    프로그램 종료 후 만료됩니다.
                </p>
                <output id="pairing"></output>
            </section>
            <form id="unlock">
                <h2>암호화 저장소 열기</h2>
                <label for="passphrase"
                    >저장소 암호 (12자 이상, 분실 시 복구 불가)</label
                ><input
                    id="passphrase"
                    type="password"
                    autocomplete="off"
                    minlength="12"
                    maxlength="256"
                    required /><button>저장소 열기 / 처음 만들기</button>
            </form>
            <form id="enroll" hidden>
                <h2>선택 계좌 API 등록</h2>
                <p id="target"></p>
                <p>
                    웹앱에서 등록 페이지를 연 계좌에만 연결합니다. 등록은 토큰
                    발급이나 거래 조회를 실행하지 않습니다.
                </p>
                <label for="accountNo">전체 토스 계좌번호 (숫자만)</label
                ><input
                    id="accountNo"
                    inputmode="numeric"
                    autocomplete="off"
                    pattern="[0-9]{8,30}"
                    required /><label for="clientId">토스 client_id</label
                ><input id="clientId" autocomplete="off" required /><label
                    for="clientSecret"
                    >토스 client_secret</label
                ><input
                    id="clientSecret"
                    type="password"
                    autocomplete="off"
                    required /><label
                    ><input id="confirmed" type="checkbox" required />선택한
                    본인 계좌의 API 정보를 이 PC의 암호화 저장소에 보관하는 것을
                    확인합니다.</label
                ><label
                    ><input id="replaceExisting" type="checkbox" />토스에서 키를
                    교체했으며 이 client의 기존 저장 키와 토큰을 교체합니다.
                    함께 연결한 다른 계좌에도 적용됩니다.</label
                ><button>이 PC에 등록</button>
            </form>
            <button id="lock" type="button">저장소 잠그기</button>
            <p id="status" role="status" aria-live="polite"></p>
        </main>
        <script src="/app.js"></script>
    </body>
</html>
